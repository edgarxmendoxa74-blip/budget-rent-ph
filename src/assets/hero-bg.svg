<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" fill="none">
  <defs>
    <linearGradient id="navyWash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#003366" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#003366" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="navyWash2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00539E" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#00539E" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="goldGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F59E0B" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#F59E0B" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldGlow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFC107" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#FFC107" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F59E0B" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#F59E0B" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#003366" fill-opacity="0.13"/>
    </pattern>
  </defs>

  <!-- soft washes -->
  <rect width="1440" height="560" fill="url(#dots)"/>
  <ellipse cx="180" cy="70" rx="460" ry="300" fill="url(#navyWash)"/>
  <ellipse cx="1300" cy="500" rx="520" ry="330" fill="url(#navyWash2)"/>
  <circle cx="1190" cy="90" r="260" fill="url(#goldGlow)"/>
  <circle cx="230" cy="470" r="230" fill="url(#goldGlow2)"/>

  <!-- floating rings -->
  <circle cx="1330" cy="180" r="72" stroke="#003366" stroke-opacity="0.16" stroke-width="2"/>
  <circle cx="1330" cy="180" r="46" stroke="#F59E0B" stroke-opacity="0.5" stroke-width="2"/>
  <circle cx="96" cy="150" r="58" stroke="#F59E0B" stroke-opacity="0.45" stroke-width="2"/>
  <circle cx="96" cy="150" r="34" stroke="#003366" stroke-opacity="0.18" stroke-width="2"/>

  <!-- house / roof line art -->
  <g stroke="#003366" stroke-opacity="0.22" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <g transform="translate(1090 330)">
      <path d="M0 34 L44 0 L88 34"/>
      <path d="M10 30 V78 H78 V30"/>
      <rect x="34" y="50" width="20" height="28"/>
    </g>
    <g transform="translate(320 96) scale(0.8)">
      <path d="M0 34 L44 0 L88 34"/>
      <path d="M10 30 V78 H78 V30"/>
      <rect x="20" y="44" width="18" height="18"/>
      <rect x="52" y="44" width="18" height="18"/>
    </g>
    <g transform="translate(60 380) scale(0.72)" stroke="#F59E0B" stroke-opacity="0.5">
      <path d="M0 34 L44 0 L88 34"/>
      <path d="M10 30 V78 H78 V30"/>
      <rect x="34" y="50" width="20" height="28"/>
    </g>
  </g>

  <!-- key / heart accents -->
  <path d="M840 430c-14-12-34-6-34 10 0 14 20 26 34 36 14-10 34-22 34-36 0-16-20-22-34-10z"
        fill="#F59E0B" fill-opacity="0.35"/>
  <g transform="translate(700 120) rotate(-12)" stroke="#003366" stroke-opacity="0.2" stroke-width="2.4" fill="none" stroke-linecap="round">
    <circle cx="0" cy="0" r="14"/>
    <path d="M12 8 L54 50 M44 40 L52 32 M36 48 L44 40"/>
  </g>

  <!-- gold divider ribbon -->
  <rect x="360" y="500" width="720" height="3" rx="1.5" fill="url(#goldLine)"/>

  <!-- scattered sparkle dots -->
  <g fill="#F59E0B" fill-opacity="0.7">
    <circle cx="520" cy="60" r="3.5"/>
    <circle cx="905" cy="200" r="3"/>
    <circle cx="240" cy="300" r="3"/>
    <circle cx="1240" cy="420" r="3.5"/>
    <circle cx="640" cy="470" r="3"/>
    <circle cx="1040" cy="70" r="2.5"/>
  </g>
  <g fill="#003366" fill-opacity="0.28">
    <circle cx="420" cy="220" r="3"/>
    <circle cx="790" cy="330" r="3"/>
    <circle cx="160" cy="250" r="2.5"/>
    <circle cx="1360" cy="330" r="3"/>
  </g>
</svg>
